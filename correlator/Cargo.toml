[package]
name = "soc-correlator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "soc-correlator"
path = "src/main.rs"

[dependencies]
axum = "=0.7.9"
tokio = { version = "=1.43.0", features = ["full"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
chrono = { version = "=0.4.39", features = ["serde"] }

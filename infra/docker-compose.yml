services:
  db:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: soc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  correlator:
    build: ../correlator
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      retries: 10

  brain:
    build: ../brain
    profiles: ["full"]
    ports: ["8082:8082"]
    environment:
      BRAIN_API_KEY: ${BRAIN_API_KEY:-dev-brain-key}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,json; print(urllib.request.urlopen('http://127.0.0.1:8082/healthz', timeout=3).read())\""]
      interval: 10s
      retries: 6

  triage:
    build: ../triage
    profiles: ["full"]
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/healthz | grep -q ok"]
      interval: 10s
      retries: 6

  backend:
    build: { context: .., dockerfile: backend/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      correlator: { condition: service_healthy }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://soc:soc@db:5432/soc
      REDIS_URL: redis://redis:6379/0
      CORRELATOR_URL: http://correlator:8081/correlate
      BRAIN_URL: ${BRAIN_URL:-}
      JEFF_URL: ${JEFF_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-next-80b-a3b-instruct:free}
      DEMO_API_KEY: ${DEMO_API_KEY:-demo-key-change-me}
      FRONTEND_URL: http://localhost:3000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)\""]
      interval: 10s
      retries: 12

  frontend:
    build: ../frontend
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
    environment:
      BACKEND_URL: http://backend:8000
      DEMO_API_KEY: ${DEMO_API_KEY:-demo-key-change-me}
      NEXT_PUBLIC_WS_URL: ws://localhost:8000

volumes:
  pgdata:
  redisdata:

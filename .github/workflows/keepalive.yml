name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -m 20 "$BACKEND_URL/healthz" || true
          curl -fsS -m 20 "$CORRELATOR_URL/healthz" || true
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CORRELATOR_URL: ${{ secrets.CORRELATOR_URL }}
